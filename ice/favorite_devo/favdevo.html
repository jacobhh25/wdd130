<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
      <table>
        <tr>
          <th>Speaker</th>
          <th>Title</th>
          <th>Location</th>
          <th>Year</th>
        </tr>
        <tr>
          <td>Brad Wilcox</td>
          <td>His Grace Is Sufficient</td>
          <td>BYU</td>
          <td>2011</td>
        </tr>
        <tr>
          <td>Lawrence E. Corbridge</td>
          <td>Stand Forever</td>
          <td>BYU</td>
          <td>2019</td>
        </tr>
        <tr>
          <td>Lynn G. Robbins</td>
          <td>Be 100 Percent Responsible</td>
          <td>BYU</td>
          <td>2017</td>
        </tr>
      </table>
      <form action="#" method="post">
        <label for="dtitle">Devotional Title:</label>
        <input type="text" id="dtitle" name="dtitle">
        <label for="lname">Speaker:</label>
        <input type="text" id="name" name="name">
        <label for="date">Date:</label>
        <input type="text" id="date" name="date">
        <input type="submit" value="Submit">
      </form>
      </div>
    </main>
  </div>
</body>
</html>
