<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prophet card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <article class="prophet-card">
    <header class="card-header">
        <h1>Dallin H. Oaks</h1>
        <p>18th President of the Church of Jesus Christ of Latter-day Saints</p>
    </header>
    <main class="card-content">
        <img src="dallin_oaks.webp" alt="Dallin H. Oaks" class="prophet-image">
       
       <ul class="prophet-details">
        <li>Born: Aug 12,1932</li>
        <li>Apostle: Apr 7, 1984</li>
        <li>Prophet: Oct 14, 2025</li>
        <ul/>
    </main>

    <footer class="card-footer">
        <p>"The gospel of Jesus Christ teaches us that our highest priority is to love God and to love our fellowmen"</p>
    </footer>

    </article>
</body>
</html>
